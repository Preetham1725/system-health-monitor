[project]
name = "system-health-monitor"
version = "0.2.0"
description = "System health monitor for CPU, memory, disk, and email alerts"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
